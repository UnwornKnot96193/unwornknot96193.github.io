<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>点击跳转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        a {
            font-size: 60px;
            font-weight: bold;
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
        /* 鼠标悬停变蓝色 */
        a:hover {
            color: #0066ff;
        }
    </style>
</head>
<body>
    <a href="https://www.bilibili.com/video/BV1GJ411x7h7" target="_blank">
        单击此处
    </a>
</body>
</html>
