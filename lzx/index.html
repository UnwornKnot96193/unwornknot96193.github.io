<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>李子轩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: white;
            text-align: center;
            padding-top: 30px;
            cursor: pointer;
        }
        #title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        #img {
            width: 260px;
            height: auto;
            animation: leftToRight 4s linear infinite;
        }
        @keyframes leftToRight {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        #bgm {
            display: none !important;
        }
    </style>
</head>
<body>

<h1 id="title">哈哈哈哈，李子轩笑死我了</h1>
<img id="img" src="1.jpg" alt="pic">

<audio id="bgm" loop src="1.mp3"></audio>

<script>
    // 标题变色
    function getRandomColor() {
        let r, g, b;
        do {
            r = Math.floor(Math.random() * 256);
            g = Math.floor(Math.random() * 256);
            b = Math.floor(Math.random() * 256);
        } while ((r>240&&g>240&&b>240) || (r>240&&g>240&&b<200));
        return `rgb(${r},${g},${b})`;
    }
    setInterval(() => {
        document.getElementById('title').style.color = getRandomColor();
    }, 50);

    // ============= 核心：绝对无法暂停 =============
    const audio = document.getElementById('bgm');
    
    // 彻底摧毁暂停功能
    audio.pause = () => audio.play();
    Object.defineProperty(audio, 'paused', { get: () => false });
    
    // 拦截所有暂停事件
    audio.addEventListener('pause', (e) => {
        e.preventDefault();
        audio.play();
    });

    // 点击屏幕播放
    document.addEventListener('click', () => {
        audio.play();
    });
</script>

</body>
</html>
