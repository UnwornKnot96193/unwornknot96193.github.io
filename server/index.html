<script type="text/javascript">
// 实时时间
function showTime() {
    var date = new Date();
    var year = date.getFullYear();
    var month = date.getMonth() + 1;
    var day = date.getDate();
    var hour = date.getHours();
    var minute = date.getMinutes();
    var second = date.getSeconds();

    month = month < 10 ? "0" + month : month;
    day = day < 10 ? "0" + day : day;
    hour = hour < 10 ? "0" + hour : hour;
    minute = minute < 10 ? "0" + minute : minute;
    second = second < 10 ? "0" + second : second;

    var timeStr = year + "-" + month + "-" + day + " " + hour + ":" + minute + ":" + second;
    document.getElementById("showTime").innerHTML = timeStr;
    setTimeout(showTime, 1000);
}

// 复制IP
document.getElementById('copyIpBtn').onclick = function() {
    var ip = 'play.simpfun.cn:42419';
    var btn = this;
    var oldText = btn.value;

    try {
        var t = document.createElement('textarea');
        t.value = ip;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
    }catch(e){}

    btn.value = "复制成功！";
    alert('服务器IP已复制到剪贴板：' + ip);
    
    setTimeout(function(){
        btn.value = oldText;
    }, 2000);
};

window.onload = function() {
    showTime();
};
</script>
